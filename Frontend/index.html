<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SupplyPrescript Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>SupplyPrescript Dashboard</h1>

        <div class="prediction-card">
            <h2>Prediction Result</h2>
            <p id="prediction">No prediction yet.</p>

            <button id="predictBtn">Predict</button>
        </div>

        <h2>Recommended Actions</h2>

        <div class="cards">

            <div class="card">
                <h3>Air Freight</h3>
                <p>Cost : ₹15,000</p>
                <p>Speed : Fast</p>
            </div>

            <div class="card">
                <h3>Secondary Supplier</h3>
                <p>Cost : +10%</p>
                <p>Speed : Medium</p>
            </div>

            <div class="card">
                <h3>Delay Launch</h3>
                <p>Cost : ₹0</p>
                <p>Speed : Slow</p>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
