<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SupplyPrescript Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>SupplyPrescript Dashboard</h1>

        <div class="prediction-card">
            <h2>Enter Shipment Details</h2>

            <label>Country</label>
            <select id="country">
                <option value="Nigeria">Nigeria</option>
                <option value="South Africa">South Africa</option>
                <option value="Uganda">Uganda</option>
                <option value="Other">Other</option>
            </select>

            <label>Shipment Mode</label>
            <select id="shipmentMode">
                <option value="Air Charter">Air Charter</option>
                <option value="Truck">Truck</option>
                <option value="Ocean">Ocean</option>
            </select>

            <label>Weight (Kilograms)</label>
            <input type="number" id="weight" placeholder="e.g. 500">

            <label>Freight Cost (USD)</label>
            <input type="number" id="freightCost" placeholder="e.g. 2000">

            <button id="customPredictBtn">Predict This Shipment</button>
            <p id="customPrediction">No prediction yet.</p>
        </div>

        <div class="prediction-card">
           <h2>Demo: Sample Prediction (Fixed Row)</h2>
            <p id="prediction">No prediction yet.</p>

            <button id="predictBtn">Predict</button>
        </div>

        <h2>Recommended Actions</h2>

        <div class="cards">

            <div class="card">
                <h3>Air Freight</h3>
                <p>Cost : ₹15,000</p>
                <p>Speed : Fast</p>
            </div>

            <div class="card">
                <h3>Secondary Supplier</h3>
                <p>Cost : +10%</p>
                <p>Speed : Medium</p>
            </div>

            <div class="card">
                <h3>Delay Launch</h3>
                <p>Cost : ₹0</p>
                <p>Speed : Slow</p>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
